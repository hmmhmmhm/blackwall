<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKWALL G2 · Emulator</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script><link rel="stylesheet" href="workbench.css"><script src="workbench.js" defer></script></head>
<body><main class="window">
<header><i class="lights" aria-hidden="true"><b></b><b></b><b></b></i><strong><i class="mark" aria-hidden="true">///</i> BLACKWALL G2</strong><span id="section">Emulator</span></header>
<nav aria-label="Workspace"><span class="device"><svg class="icon" aria-hidden="true"><use href="icons.svg#device"></use></svg> Even G2 B</span><div id="tabs"></div></nav>
<section class="workspace"><div class="display"><img class="guest" src="guest-dashboard-preview.png" width="576" height="288" alt="Guest dashboard showing Sat 1, 08:00, and no news available"><article id="panel" hidden></article></div>
<aside><h2><svg class="icon" aria-hidden="true"><use href="icons.svg#chip"></use></svg> G2 Temple PCB <small>3D approximation</small></h2><div class="inspector"><div class="board-view"><model-viewer id="board-model" src="board-model-bw590/g2-temple-assembly.glb" alt="Approximate 3D model of G2 temple PCB. Drag to rotate." camera-controls touch-action="pan-y" orientation="0deg 0deg 0deg" camera-orbit="0deg 90deg auto" shadow-intensity="0.7" interaction-prompt="none"></model-viewer><div class="board-controls" aria-label="Board view"><button id="board-front">Front</button><button id="board-back">Back</button><button id="board-toggle" aria-pressed="false">Bare PCB</button></div></div><div id="layers"></div></div><div id="detail" hidden role="status"></div></aside></section>
<section class="timeline"><h2><svg class="icon" aria-hidden="true"><use href="icons.svg#timeline"></use></svg>Timeline</h2><button id="play" aria-label="Play preview timeline"><svg class="icon" aria-hidden="true"><use href="icons.svg#play"></use></svg></button><output id="clock">00:00 / 05:00</output><input type="range" min="0" max="300" value="0" aria-label="Timeline seconds"><span class="firmware">FW v2.3</span></section>
<footer><h2><svg class="icon" aria-hidden="true"><use href="icons.svg#logs"></use></svg>Logs</h2><div class="log-body"><div id="events" role="log"></div></div></footer>
</main></body></html>
