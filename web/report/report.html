<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKWALL G2 · Emulator</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="report.css"><script src="report-data.js" defer></script><script src="report.js" defer></script></head>
<body><main class="window">
<header><i class="lights" aria-hidden="true"><b></b><b></b><b></b></i><strong><i class="mark" aria-hidden="true">///</i> BLACKWALL G2</strong><span id="section">Emulator</span></header>
<nav aria-label="Workspace"><span class="device"><svg class="icon" aria-hidden="true"><use href="icons.svg#device"></use></svg> Even G2 B</span><div id="tabs"></div></nav>
<section class="workspace"><div class="display"><img class="guest" src="screen.png" width="576" height="288" alt="Guest dashboard showing Sat 1, 08:00, and no news available"><div class="frame-controls" id="frame-controls" hidden><button id="frame-mode" type="button">View raw</button></div><div id="frame-wait" class="frame-wait" hidden>NO DISPLAY DATA</div><article id="panel" hidden></article></div>
<aside><h2><svg class="icon" aria-hidden="true"><use href="icons.svg#chip"></use></svg> G2 Temple PCB <small>3D approximation</small></h2><div class="inspector"><div class="board-view"><div class="board-models" aria-label="Front and back views">
<div class="board-side"><model-viewer id="board-front-model" tabindex="0" src="board-model-bw590/g2-temple-assembly.glb" alt="Approximate front of G2 temple PCB" camera-controls touch-action="pan-y" orientation="0deg 0deg 0deg" camera-orbit="0deg 90deg 0.055m" shadow-intensity="0.7" interaction-prompt="none"></model-viewer></div>
<div class="board-side"><model-viewer id="board-back-model" tabindex="0" src="board-model-bw590/g2-temple-assembly.glb" alt="Approximate back of G2 temple PCB" camera-controls touch-action="pan-y" orientation="0deg 0deg 0deg" camera-orbit="180deg 90deg 0.055m" shadow-intensity="0.7" interaction-prompt="none"></model-viewer></div>
</div><div id="board-component" class="board-component" aria-live="off">Observed to playhead</div><div id="component-list" class="component-list" aria-label="Observed component positions"></div><div class="board-controls" aria-label="Board view"><button id="board-toggle" aria-pressed="false">Bare PCB</button></div></div><section class="stages" aria-label="Boot stages"><div class="stages-heading">BOOT SEQUENCE <small>Observed</small></div><ol id="stages-list"></ol><div class="stage-legend">Green: observed · pulse: recent (0.7 s) · * illustrative location</div></section></div></aside></section>
<section class="timeline"><h2><svg class="icon" aria-hidden="true"><use href="icons.svg#timeline"></use></svg>Timeline</h2><button id="play" aria-label="Play preview timeline"><svg class="icon" aria-hidden="true"><use href="icons.svg#play"></use></svg></button><output id="clock">00:00 / 05:00</output><input type="range" min="0" max="300" value="0" aria-label="Timeline seconds"><span class="firmware" id="report-status">RUN</span></section>
<footer><h2><svg class="icon" aria-hidden="true"><use href="icons.svg#logs"></use></svg>Logs</h2><div class="log-body" tabindex="0" aria-label="Logs up to current time"><div id="boot-trace" hidden></div><div id="events" role="log" aria-live="off"></div></div></footer>
</main></body></html>
